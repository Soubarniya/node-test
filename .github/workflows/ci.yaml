name: Node.js CI/CD Workflow
#test
on:
  push:
    branches:
      - main
      - devops
  pull_request:
    branches:
      - development

jobs:
  Code-Build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: List files
        run: ls -al
      
      - name: Set up Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Build code
        run: npm run 

      - name: Create/Update ciJob Entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ciJob-${{ github.run_id }}
          icon: GithubActions
          blueprint: ciJob
          properties: |
            {
              "commitHash": "${{ github.sha }}",
              "jobBranch": "https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}",
              "runLink": "${{ github.server_url }}${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "triggeredBy": "${{ github.actor }}"
            }

  Docker-Build-Push:
    runs-on: ubuntu-latest
    needs: Code-Build

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read version from VERSION file
        id: read_version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Build Docker image
        run: docker build -t soubarniya/mynode:${{ env.VERSION }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push soubarniya/mynode:${{ env.VERSION }}

      - name: Create Image Entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: mynode-image-${{ env.VERSION }}
          title: Docker Image for mynode
          icon: Docker
          blueprint: image
          properties: |
            {
              "imageTag": "${{ env.VERSION }}",
              "imageRegistry": "https://hub.docker.com/r/soubarniya/mynode",
              "size": "100"
            }

      - name: Link ciJob to Image Entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ciJob-${{ github.run_id }}
          blueprint: ciJob
          relations: |
            {
              "image": ["mynode-image-${{ env.VERSION }}"]
            }

  K8s-Manifest-Update:
    runs-on: ubuntu-latest
    needs: Docker-Build-Push

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: read_version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check for Docker image
        run: docker pull soubarniya/mynode:${{ env.VERSION }}

      - name: Update Kubernetes manifest
        run: |
          git clone https://github.com/Soubarniya/argocd.git
          cd argocd
          git checkout -b node-version-${{ env.VERSION }}
          sed -i "s|image: soubarniya/mynode:.*|image: soubarniya/mynode:${{ env.VERSION }}|" node.yaml
          git config --global user.email "leosphere2001@gmail.com"
          git config --global user.name "Soubarniya"
          if git diff --exit-code --quiet; then
            echo "No changes to commit."
          else
            git add node.yaml
            git commit -m "Updated node.yaml with version ${{ env.VERSION }}"
            git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/Soubarniya/argocd.git node-version-${{ env.VERSION }}
          fi
  
      - name: Trigger run in Port
        id: trigger_run
        run: |
          RESPONSE=$(curl -X POST -H "Authorization: Bearer ${{ secrets.PORT_API_TOKEN }}" https://api.getport.io/v1/runs -d '{"job":"your-job-details"}')
          echo "Response from Port API: $RESPONSE"  # Log the response for debugging
          runId=$(echo $RESPONSE | jq -r '.runId')
          echo "runId=$runId" >> $GITHUB_ENV

          
      - name: Update Self-Service Run Status in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ env.runId }}
          icon: Kubernetes
          status: SUCCESS
          logMessage: "Deployment updated successfully"
